<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 暗色底渐变（与 App UITheme 一致） -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2F35"/>
      <stop offset="1" stop-color="#17181A"/>
    </linearGradient>
    <!-- 照片内容：暖调黄昏 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C274"/>
      <stop offset="0.55" stop-color="#DE8F4B"/>
      <stop offset="1" stop-color="#A65F3A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="pillShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS 圆角方块底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sheen)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="4"/>

  <!-- 后层卡片（微旋） -->
  <g transform="rotate(-9 512 470)" filter="url(#cardShadow)">
    <rect x="300" y="270" width="424" height="318" rx="30" fill="#D9DADF"/>
  </g>
  <!-- 中层卡片（反向微旋） -->
  <g transform="rotate(5 512 500)" filter="url(#cardShadow)">
    <rect x="304" y="300" width="416" height="312" rx="30" fill="#ECEDEF"/>
  </g>

  <!-- 前层照片卡 -->
  <g filter="url(#cardShadow)">
    <rect x="306" y="330" width="412" height="310" rx="30" fill="#F5F5F7"/>
    <!-- 照片区 -->
    <g>
      <rect x="330" y="354" width="364" height="222" rx="16" fill="url(#sky)"/>
      <!-- 太阳 -->
      <circle cx="600" cy="430" r="40" fill="#FFE9BE"/>
      <!-- 远山 -->
      <path d="M330 576 L452 470 L540 540 L610 488 L694 576 Z" fill="#6B5140"/>
      <!-- 近山 -->
      <path d="M330 576 L430 512 L560 576 Z" fill="#443529"/>
      <rect x="330" y="560" width="364" height="16" fill="#443529"/>
      <clipPath id="photoClip"><rect x="330" y="354" width="364" height="222" rx="16"/></clipPath>
      <rect x="330" y="354" width="364" height="222" rx="16" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
    </g>
    <!-- 文件名条：原名 -->
    <rect x="330" y="592" width="364" height="26" rx="8" fill="#26272B"/>
    <rect x="342" y="600" width="150" height="10" rx="5" fill="#8B8E95"/>
  </g>

  <!-- 改名箭头药丸（绿色 = 新名字的语义色） -->
  <g filter="url(#pillShadow)">
    <rect x="544" y="560" width="212" height="96" rx="48" fill="#17181A"/>
    <rect x="544" y="560" width="212" height="96" rx="48" fill="none" stroke="#4CC38A" stroke-opacity="0.35" stroke-width="3"/>
    <!-- 箭头 -->
    <path d="M596 608 H676" stroke="#4CC38A" stroke-width="18" stroke-linecap="round"/>
    <path d="M652 578 L690 608 L652 638" fill="none" stroke="#4CC38A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
